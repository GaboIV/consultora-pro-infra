# =====================================================================
#  ConsultoraPro - Compose de DESPLIEGUE (servidor QA / Produccion)
# =====================================================================
#  A diferencia de docker-compose.yml (que COMPILA el codigo local),
#  este archivo DESCARGA imagenes ya construidas desde GHCR.
#
#  Uso en el servidor:
#     docker compose -f docker-compose.deploy.yml --env-file .env pull
#     docker compose -f docker-compose.deploy.yml --env-file .env up -d
#
#  Las variables (${...}) salen del archivo .env del servidor.
#  GitHub Actions ejecuta estos comandos por SSH automaticamente.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-consultorapro}

services:
  # 1. Base de datos MySQL
  database:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-consultorapro}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # 2. Backend (.NET Web API) - imagen desde GHCR
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-consultorapro}_backend
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=database;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Encryption__Key=${ENCRYPTION_KEY}
      # --- Autenticacion: credenciales y/o Google (reusa las env vars de Outline) ---
      - Auth__CredentialsEnabled=${CREDENTIALS_ENABLED:-true}
      - Auth__Google__Enabled=${GOOGLE_ENABLED:-false}
      - Auth__Google__FrontendBaseUrl=${FRONTEND_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Almacenamiento de archivos: Azure Blob (contenedor privado + SAS). Credenciales por secreto.
      - Storage__Provider=AzureBlob
      - Storage__AzureBlob__ConnectionString=${STORAGE_CONNECTION_STRING}
      - Storage__AzureBlob__ContainerName=${STORAGE_CONTAINER}
      # --- Notificaciones por correo (ver docs/11-notificaciones.md) ---
      # EMAIL_PROVIDER: Console | Smtp | Brevo | Resend
      - Email__Provider=${EMAIL_PROVIDER:-Console}
      - Email__From=${EMAIL_FROM:-no-reply@consultorapro.local}
      - Email__FromName=${EMAIL_FROM_NAME:-ConsultoraPro}
      - Email__FrontendBaseUrl=${FRONTEND_BASE_URL}
      - Email__Smtp__Host=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - Email__Smtp__Port=${EMAIL_SMTP_PORT:-587}
      - Email__Smtp__User=${EMAIL_SMTP_USER:-}
      - Email__Smtp__Password=${EMAIL_SMTP_PASSWORD:-}
      - Email__Brevo__ApiKey=${BREVO_API_KEY:-}
      - Email__Resend__ApiKey=${RESEND_API_KEY:-}
    # SIN puerto publicado: el backend solo vive en la red interna 'internal'.
    # El contenedor frontend lo alcanza como 'backend:8080' y hace proxy de /api.
    # (Para depurar/migraciones puedes exponerlo temporalmente atandolo a
    #  127.0.0.1, p.ej.:  ports: ["127.0.0.1:15000:8080"])
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  # 3. Frontend (Angular + Nginx) - imagen desde GHCR
  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME:-consultorapro}_frontend
    restart: always
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-15001}:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
